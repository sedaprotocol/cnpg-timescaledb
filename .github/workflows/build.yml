name: build

# Rebuilds the CNPG + TimescaleDB operand image on top of the upstream CNPG
# base to pick up Postgres minor patches and CVE fixes, while keeping PG major
# and TimescaleDB versions pinned. Runs bi-weekly, on relevant pushes, and on
# manual dispatch (with version overrides).

on:
  schedule:
    # 06:00 UTC on the 1st and 15th of each month (bi-weekly).
    - cron: "0 6 1,15 * *"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      pg_major:
        description: "PostgreSQL major version"
        required: false
        default: "18"
      timescale_version:
        description: "TimescaleDB version (without ~debian suffix)"
        required: false
        default: "2.26.4"
      debian_release:
        description: "Debian release codename (must match the CNPG base tag)"
        required: false
        default: "trixie"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PG_MAJOR: ${{ github.event.inputs.pg_major || '18' }}
  TIMESCALE_VERSION: ${{ github.event.inputs.timescale_version || '2.26.4' }}
  DEBIAN_RELEASE: ${{ github.event.inputs.debian_release || 'trixie' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          date_stamp="$(date -u +%Y%m%d)"
          sha_short="${GITHUB_SHA::7}"
          base="${REGISTRY}/${IMAGE_NAME}"
          ver="${PG_MAJOR}-ts${TIMESCALE_VERSION}"
          {
            echo "tags<<EOF"
            echo "${base}:${ver}"
            echo "${base}:${ver}-${date_stamp}"
            echo "${base}:${ver}-${date_stamp}-${sha_short}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "base_tag=${PG_MAJOR}-standard-${DEBIAN_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PG_MAJOR=${{ env.PG_MAJOR }}
            TIMESCALE_VERSION=${{ env.TIMESCALE_VERSION }}
            DEBIAN_RELEASE=${{ env.DEBIAN_RELEASE }}
            BASE_TAG=${{ steps.meta.outputs.base_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (extension loads)
        run: |
          set -euo pipefail
          img="${REGISTRY}/${IMAGE_NAME}:${PG_MAJOR}-ts${TIMESCALE_VERSION}"
          docker run --rm \
            -e PG_MAJOR="${PG_MAJOR}" \
            -e TIMESCALE_VERSION="${TIMESCALE_VERSION}" \
            --entrypoint /bin/sh "$img" -c '
              set -eux
              test -f "/usr/lib/postgresql/${PG_MAJOR}/lib/timescaledb.so"
              ls "/usr/share/postgresql/${PG_MAJOR}/extension/timescaledb--${TIMESCALE_VERSION}.sql"
            ' || (echo "smoke test failed: timescaledb artifacts missing" && exit 1)
