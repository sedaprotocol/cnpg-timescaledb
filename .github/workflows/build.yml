name: build

# Rebuilds the operand image to pick up Postgres minor/CVE patches while PG
# major and TimescaleDB stay pinned. See README "Version policy".

on:
  schedule:
    # 06:00 UTC on the 1st and 15th of each month (bi-weekly).
    - cron: "0 6 1,15 * *"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      pg_major:
        description: "PostgreSQL major version"
        required: false
        default: "18"
      timescale_version:
        description: "TimescaleDB version (without ~debian suffix)"
        required: false
        default: "2.26.4"
      debian_release:
        description: "Debian release codename (must match the CNPG base tag)"
        required: false
        default: "trixie"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Artifact Registry only accepts runs on main (enforced by the Workload Identity provider); tags there are immutable.
  GAR_HOST: europe-docker.pkg.dev
  GAR_IMAGE: europe-docker.pkg.dev/${{ vars.GAR_PROJECT_ID }}/cnpg/cnpg-timescaledb
  PG_MAJOR: ${{ github.event.inputs.pg_major || '18' }}
  TIMESCALE_VERSION: ${{ github.event.inputs.timescale_version || '2.26.4' }}
  DEBIAN_RELEASE: ${{ github.event.inputs.debian_release || 'trixie' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          date_stamp="$(date -u +%Y%m%d)"
          sha_short="${GITHUB_SHA::7}"
          base="${REGISTRY}/${IMAGE_NAME}"
          ver="${PG_MAJOR}-ts${TIMESCALE_VERSION}"
          {
            echo "tags<<EOF"
            echo "${base}:${ver}"
            echo "${base}:${ver}-${date_stamp}"
            echo "${base}:${ver}-${date_stamp}-${sha_short}"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "${GAR_IMAGE}:${ver}-${date_stamp}-${sha_short}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "base_tag=${PG_MAJOR}-standard-${DEBIAN_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        id: gcp
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GAR_WIF_PROVIDER }}
          service_account: ${{ vars.GAR_PUBLISHER_SA }}
          token_format: access_token
          create_credentials_file: false

      - name: Log in to Artifact Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GAR_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PG_MAJOR=${{ env.PG_MAJOR }}
            TIMESCALE_VERSION=${{ env.TIMESCALE_VERSION }}
            DEBIAN_RELEASE=${{ env.DEBIAN_RELEASE }}
            BASE_TAG=${{ steps.meta.outputs.base_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (extension artifacts present)
        run: |
          set -euo pipefail
          img="${REGISTRY}/${IMAGE_NAME}:${PG_MAJOR}-ts${TIMESCALE_VERSION}"
          docker run --rm \
            -e PG_MAJOR="${PG_MAJOR}" \
            -e TIMESCALE_VERSION="${TIMESCALE_VERSION}" \
            --entrypoint /bin/sh "$img" -c '
              set -eux
              test -f "/usr/lib/postgresql/${PG_MAJOR}/lib/timescaledb.so"
              test -f "/usr/share/postgresql/${PG_MAJOR}/extension/timescaledb--${TIMESCALE_VERSION}.sql"
            '

      # Separate from the login step so the credentials file only exists after the image is built.
      - name: Authenticate to Google Cloud for signing
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GAR_WIF_PROVIDER }}
          service_account: ${{ vars.GAR_PUBLISHER_SA }}

      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4.1.2

      # Empty signing config: no transparency log, so verification matches the other internal images.
      - name: Sign image in Artifact Registry
        if: github.ref == 'refs/heads/main'
        env:
          COSIGN_KEY: ${{ vars.COSIGN_KEY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign signing-config create --out "$RUNNER_TEMP/signing-config.json"
          cosign sign --yes \
            --key "$COSIGN_KEY" \
            --signing-config "$RUNNER_TEMP/signing-config.json" \
            "${GAR_IMAGE}@${DIGEST}"
